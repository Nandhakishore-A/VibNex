<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 40 40"
  fill="none"
  role="img"
  aria-label="VIBNEX logo"
>
  <defs>
    <linearGradient id="vibnex-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="vibnex-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Sleek rounded geometric V -->
  <path
    d="M6 8 L16 32 Q20 36 24 32 L34 8"
    stroke="url(#vibnex-cyan-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Inner floating chevron -->
  <path
    d="M13 10 L20 25 L27 10"
    stroke="url(#vibnex-cyan-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
</svg>
